releaseNotes: >-
  Versione 1.34.0: ricorrenze giornaliere, settimanali, mensili e annuali nel
  Personal Organizer, con intervallo e preavviso configurabili. Completa e
  passa alla prossima scadenza conserva lo storico e genera una sola nuova
  occorrenza futura, senza duplicati. Gestione di fine mese e anni bisestili.
  Nuove viste Oggi, Prossimi 7 giorni e Scaduti. Rimanda 1 ora sospende gli
  avvisi senza spostare la cadenza. Ricorrenze e storico inclusi nel backup ZIP.
  Logo originale, home pubblica e stile Dvsolutions mantenuti.

