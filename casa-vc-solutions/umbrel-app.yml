gallery: []
releaseNotes: >-
  Versione 1.20.0: ricerca indirizzi sulla mappa RailFiber tramite Photon
  (dati OpenStreetMap). Selezionando un risultato si centra la mappa e si
  compilano indirizzo e coordinate del nuovo sito; nome e salvataggio restano
  espliciti. Il filtro dei siti salvati cerca anche nell'indirizzo. Ricerca
  protetta dal login, cache e limiti alle richieste. Richiede Internet.
  Dati esistenti conservati.

