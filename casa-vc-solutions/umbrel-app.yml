manifestVersion: 1
id: casa-vc-solutions
name: VC Solutions
tagline: IT, Homelab, Networking e Camper in un'unica dashboard
icon: https://raw.githubusercontent.com/vdanesi/umbrel-app-store/main/casa-vc-solutions/icon.svg
category: files
version: "1.16.0"
port: 3959
description: >-
  Dashboard personale VC Solutions dedicata a IT, Homelab, Networking e Camper.


  Include monitoraggio live dell'host Umbrel tramite VC Solutions Collector,
  inventario Docker e Network Live con controlli ICMP e HTTPS, latenza, stato HTTP e stato dei nodi.


  Include inventario LAN con scansione in background, ricerca, filtri e dettagli
  SNMP dei dispositivi. Le sezioni Camper e Viaggi gestiscono scheda del mezzo,
  itinerari, tappe, pernottamenti, budget e spese con salvataggio persistente.
  Include una raccolta POI con categorie, coordinate, note, ricerca e mappa
  OpenStreetMap. I POI possono diventare tappe dei viaggi, con coordinate e note
  conservate. La mappa dell'itinerario mostra le tappe numerate e riordinabili.
  CasaOS mantiene il solo controllo di raggiungibilità HTTPS.
  Il menu PROJECTS permette
  di configurare e aprire Camper Planner, RailFiber Manager e App per Scontrini.
developer: VC Solutions
website: https://github.com/vdanesi/vc-solutions-dashboard
submitter: VC Solutions
submission: https://github.com/vdanesi/umbrel-app-store
repo: https://github.com/vdanesi/vc-solutions-dashboard
support: https://github.com/vdanesi/vc-solutions-dashboard/issues
gallery: []
releaseNotes: >-
  Versione 1.16.0: riepilogo con dati reali dell'host Umbrel, Docker, controlli
  di rete e inventario LAN, oltre ai conteggi di viaggi, tappe e POI salvati.
  Aggiornamento automatico e orari delle fonti; dati assenti o troppo vecchi
  vengono indicati come non disponibili. I dettagli richiedono il login e
  vengono rimossi alla scadenza della sessione. CasaOS resta un controllo HTTPS.

