releaseNotes: >-
  Versione 1.19.0: creazione siti selezionando un punto della mappa, con nome
  e salvataggio espliciti. PDF per sito e rack con inventario e schede di tutti
  i cassetti contenuti; esportazione PDF del singolo cassetto. Riepilogo degli
  stati e delle porte collegate, dettagli cavo/fibra/connettore e legenda SM/MM.
  Vista delle posizioni U dei cassetti nel rack e lista delle posizioni non
  impostate. Dati esistenti conservati.

