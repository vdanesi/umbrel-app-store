releaseNotes: >-
  Versione 1.37.1: corrette le scritte alla selezione dei punti RailFiber.
  Etichette con larghezza adeguata, fondo scuro e contrasto elevato;
  nome, tipo di punto e chilometraggio separati su righe leggibili.
  Caratteri ingranditi e scheda con coordinate e chilometraggio in
  riquadri distinti. Qualita dei dati sempre visibile, fonti espandibili.
  Impaginazione adatta anche al telefono. Mappa stabile e dati mantenuti.

