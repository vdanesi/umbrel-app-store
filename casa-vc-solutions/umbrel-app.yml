gallery: []
releaseNotes: >-
  Versione 1.37.0: la mappa RailFiber mantiene posizione e zoom durante
  aggiornamenti, selezione e salvataggio. Il pulsante VISTA STANDARD
  ripristina la rete completa. Aggiunto il ramo Iseo-Rovato con Cazzago
  San Martino, Rovato Centro e Rovato FN. Catalogo con 108 PL e progressive
  dal fascicolo Ferrovienord CT 25/2026, con origine Brescia o Bornato
  esplicitata. Posizioni PL abbinate a OSM da verificare o stimate sul
  tracciato, riconoscibili dal tratteggio. Aggiunte 23 gallerie cartografate,
  con tracciato e chilometraggio stimato chiaramente indicato. Filtri per
  tratta e categoria, ricerca per progressiva e fonti nelle schede.
  Dati fibra e logo originale mantenuti.

