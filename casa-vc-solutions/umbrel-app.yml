releaseNotes: >-
  Versione 1.31.0: avvisi di guasto e ripristino dei controlli applicativi.
  Soglie configurabili, predefinite a 3 risposte non conformi e 2 conformi
  consecutive. Stato persistente ai riavvii e storico fino a 30 giorni,
  massimo 500 eventi. Notifiche browser attivabili sulla home e ntfy
  opzionale configurabile dopo login, con invio dal server anche a pagina
  chiusa. Esito invii riservato e tentativi limitati. Impostazioni, stato
  ed eventi inclusi nel backup ZIP. Home pubblica e stile Dvsolutions mantenuti.

