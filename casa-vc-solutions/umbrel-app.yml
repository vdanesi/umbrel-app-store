releaseNotes: >-
  Versione 1.33.0: vista del percorso fibra registrato dalla scheda porta.
  Mostra i due estremi con sito, rack, cassetto, stato, colore, cavo, numero
  fibra e connettore. Apertura diretta della porta di destinazione e PDF A4
  con verifiche e dati mancanti. Evidenzia guasti, porte da verificare e fibre
  duplicate nello stesso cassetto. Destinazioni testuali e stato passante non
  generano collegamenti dedotti. Esportazione protetta da controllo revisione.
  Home pubblica e stile Dvsolutions mantenuti.

