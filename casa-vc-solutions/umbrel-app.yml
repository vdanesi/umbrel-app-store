gallery: []
releaseNotes: >-
  Versione 1.38.0: editor Quadri integrato con grafica del sito e colori
  Dvsolutions. Sedi e quadri, diagramma, tabella porte e dettaglio laterale
  usano lo stesso archivio di quadri.dvso.net. Accesso con le credenziali
  Quadri, dopo il login alla dashboard. Dalla mappa si apre una sede o si
  prepara una nuova sede dal punto selezionato. Controllo del documento
  remoto prima del salvataggio e verifica del risultato; conflitti ed errori
  sospendono gli invii mantenendo le modifiche aperte. Aggiornamenti dal sito
  rilevati quando non si sta compilando un campo. Interfaccia adattata al
  telefono, token tecnico mantenuto sul server. Inventario locale e logo
  originale conservati.

