manifestVersion: 1
id: casa-vc-solutions
name: Dvsolutions
tagline: IT, Homelab, Networking e Camper in un'unica dashboard
icon: https://raw.githubusercontent.com/vdanesi/umbrel-app-store/main/casa-vc-solutions/icon.svg
category: files
version: "1.22.2"
port: 3959
description: >-
  Dashboard personale Dvsolutions dedicata a IT, Homelab, Networking e Camper.


  Include monitoraggio live dell'host Umbrel tramite Dvsolutions Collector,
  inventario Docker e Network Live con controlli ICMP e HTTPS, latenza, stato HTTP e stato dei nodi.


  Include inventario LAN con scansione in background, ricerca, filtri e dettagli
  SNMP dei dispositivi. Le sezioni Camper e Viaggi gestiscono scheda del mezzo,
  itinerari, tappe, pernottamenti, budget e spese con salvataggio persistente.
  Include una raccolta POI con categorie, coordinate, note, ricerca e mappa
  OpenStreetMap. I POI possono diventare tappe dei viaggi, con coordinate e note
  conservate. La mappa dell'itinerario mostra le tappe numerate e riordinabili.
  CasaOS mantiene il solo controllo di raggiungibilità HTTPS.
  RailFiber è un modulo interno con siti, rack, cassetti, porte, collegamenti,
  mappa interattiva e schede PDF. Il menu PROJECTS apre RailFiber e permette
  di configurare Camper Planner e App per Scontrini.
