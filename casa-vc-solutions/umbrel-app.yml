releaseNotes: >-
  Versione 1.17.0: sezione RailFiber con riepilogo reale di siti, rack, cassetti,
  porte, collegamenti e segnalazioni. Mappa siti e collegamenti registrati.
  Integrazione configurabile con chiave di sola lettura generata da RailFiber
  Manager 1.3.0. Dettagli protetti dal login; errori o chiavi revocate rimuovono
  i valori precedenti. Riepilogo fibra anche nella dashboard principale.

