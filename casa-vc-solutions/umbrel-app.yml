releaseNotes: >-
  Versione 1.13.0: sezioni CAMPER e VIAGGI operative direttamente nella dashboard.
  Scheda del mezzo con dimensioni, massa, consumo e note. Gestione itinerari con
  date, destinazione, tappe, notti, budget e spese per categoria. Totali automatici,
  salvataggio persistente e controllo dei conflitti tra schede. Accesso protetto
  dall'account esistente. Nessuna sincronizzazione con Camper Planner.

