releaseNotes: >-
  Versione 1.27.0: avvisi per scadenze imminenti e raggiunte nell'Organizer,
  con Rimanda 1 ora e Completa. Notifiche browser facoltative dopo consenso,
  disponibili tramite HTTPS o localhost mentre Dvsolutions è aperta.
  Deduplicazione degli avvisi per scadenza e fase, controllo ogni 30 secondi.
  Preferenze specifiche del browser. Dati e tutte le funzioni precedenti
  conservati, inclusi backup ZIP e dashboard personale.

