releaseNotes: >-
  Versione 1.35.0: promemoria e attivita collegati a siti, rack, cassetti
  RailFiber, servizi monitorati e progetti. Apertura diretta della scheda
  associata e creazione di un promemoria dal relativo elemento. Scadenze
  aperte e interventi completati visibili nelle schede, con data e nota
  facoltativa del lavoro svolto. I siti e i rack includono le attivita degli
  elementi contenuti. Collegamenti mantenuti nelle ricorrenze successive;
  note intervento conservate sul completamento. Dati inclusi nel backup ZIP.
  Logo originale, home pubblica e stile Dvsolutions mantenuti.

