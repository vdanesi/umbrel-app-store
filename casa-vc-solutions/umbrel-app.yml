releaseNotes: >-
  Versione 1.22.2: pulsante Copia da per duplicare la configurazione
  di una fibra su un’altra fibra dello stesso cavo, dopo conferma.
  Copia servizi, collegamenti, stati e connettori, inclusi quelli originali
  del modello Excel. Numeri delle fibre e distanze comuni restano invariati.
  Copie indipendenti dalle successive modifiche della sorgente.
  Backup precedenti compatibili e nessuna migrazione del portale.

