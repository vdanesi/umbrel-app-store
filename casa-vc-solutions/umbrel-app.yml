gallery: []
releaseNotes: >-
  Versione 1.36.0: mappa RailFiber con 36 punti della Brescia-Iseo-Edolo:
  30 stazioni e fermate del quadro passeggeri Trenord e 6 altri impianti
  distinti in giallo. Ricerca per nome, filtri, elenco e inquadratura della
  tratta. Clic sul punto per aprire il sito esistente, creare una scheda
  con coordinate precompilate oppure associare un sito gia presente.
  Controlli sulle associazioni duplicate e sulle revisioni. Coordinate e
  note locali mantenute; nessuna importazione automatica nell'archivio fibra.
  Fonti e attribuzioni consultabili dalla mappa. Logo originale mantenuto.

