# FN Avanzamento Gallerie - configurazione Apache del container
# Protegge dati e app anche senza .htaccess (AllowOverride None)
ServerName fn-gallerie
ServerTokens Prod
ServerSignature Off
# variabili del container visibili a PHP
PassEnv FN_FORCE_HTTPS TZ
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(data|private)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(lib\.php|.*\.(json|log|bin|tmp|lock|txt|yml|sh))$">
    Require all denied
</FilesMatch>
