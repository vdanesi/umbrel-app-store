releaseNotes: >-
  Dati senza doppioni: nella scheda del PL ogni dato di rete compare una sola volta
  (gateway e VLAN insieme, DNS e maschera dal file dei PL), il quadro non ripete i campi di
  rete, PL ripetuti uniti in uno solo, giunto G59B ripetuto tolto, fogli Excel senza
  colonne ripetute. Corretti gli indirizzi degli uplink scritti come numeri nel file degli
  switch. Nuovo pulsante "Togli doppioni" nel Database PL.
