gallery: []
releaseNotes: >-
  Giunti delle fibre da Excel: "Importa giunti da Excel" nelle Vasche di giunzione crea una
  vasca per pozzetto (i giunti nello stesso punto stanno nella stessa vasca) e calcola la
  progressiva km dal binario reale, con la distanza dal binario. Colori per cavo sulla
  mappa (FO 48, FO 16, entrambi), filtri per cavo e linea, ricerca, colonne nuove
  nell'Excel. Il pacchetto dati aggiornato contiene già i giunti Iseo–Edolo.
