gallery: []
releaseNotes: >-
  "Allinea ferrovia" allinea anche le vasche di giunzione: si spostano sul binario (a 4 m,
  dal lato del pozzetto) e la posizione GPS del file resta salvata. Le vasche con il GPS
  oltre 300 m dal binario restano sul punto GPS da controllare. Nella scheda: "usa GPS"
  oppure "allinea al binario" per la singola vasca.
