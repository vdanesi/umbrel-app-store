releaseNotes: >-
  Rete dei PL: "Importa rete PL" nel Database legge il file Excel con switch, apparati
  (ADAM, HP, tromba, telecamera), porte e indirizzi IP di ogni PL, lo unisce ai PL già
  presenti per progressiva km e crea quelli mancanti sul binario (anche sul ramo
  Bornato–Rovato). Nuova scheda "Rete e apparati" nel PL, IP dei PL nel controllo dei
  doppioni e nuovo foglio Rete_PL nell'Excel.
