releaseNotes: >-
  Configurazione degli switch dei PL: lo stesso "Importa rete PL" legge anche il file degli
  switch (uplink G1/1 e G1/2 con provenienza e destinazione, VLAN di servizio, loopback,
  DNS, PDF di configurazione). Nella scheda "Rete e apparati" del PL compaiono
  configurazione e uplink con collegamento agli switch vicini, i controlli di coerenza
  tra i due file, loopback e uplink nel piano IP e il nuovo foglio Switch_PL nell'Excel.
