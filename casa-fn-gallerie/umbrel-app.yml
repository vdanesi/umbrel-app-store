gallery: []
releaseNotes: >-
  Nuove vasche di giunzione: si aggiungono con un clic sulla mappa reale e hanno la loro
  scheda (manufatto, cavi, muffola, fibre giuntate, stato, documenti, note), il livello
  "Vasche" sulla mappa, l'elenco nel Database e il foglio nell'Excel. Pulsanti "Elimina"
  in vista nelle schede di box, POI, PL e vasche.
