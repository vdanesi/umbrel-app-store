# Costruisce e pubblica l'immagine Docker di FN Avanzamento Gallerie su GitHub Container Registry
# a ogni modifica del codice o della versione. Umbrel e CasaOS scaricano l'immagine indicata nei docker-compose.
name: Immagine Docker FN Gallerie

on:
  push:
    branches: [main]
    paths:
      - "casa-fn-gallerie/app/**"
      - "casa-fn-gallerie/umbrel-app.yml"
      - ".github/workflows/fn-gallerie.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione da umbrel-app.yml
        id: versione
        run: |
          v=$(grep -E '^version:' casa-fn-gallerie/umbrel-app.yml | sed -E 's/^version: *"?([^"]+)"?.*/\1/')
          echo "Versione: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Controlla che il programma non contenga dati del progetto
        run: |
          f=casa-fn-gallerie/app/www/private/app.html
          grep -q 'const FN_CLEAN = "1"==="1"' "$f" || { echo "app.html non è la versione pulita"; exit 1; }
          ! test -e casa-fn-gallerie/app/www/data/datapack.json || { echo "pacchetto dati nel repository!"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: casa-fn-gallerie/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fn-gallerie:${{ steps.versione.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/fn-gallerie:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=FN Avanzamento Gallerie
            org.opencontainers.image.version=${{ steps.versione.outputs.v }}
