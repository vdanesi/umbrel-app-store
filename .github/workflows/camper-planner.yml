# Costruisce e pubblica l'immagine Docker di Camper Planner su GitHub Container Registry
# a ogni modifica del codice o della versione. Umbrel scarica l'immagine indicata in docker-compose.yml.
name: Immagine Docker Camper Planner

on:
  push:
    branches: [main]
    paths:
      - "casa-camper-planner/app/**"
      - "casa-camper-planner/umbrel-app.yml"
      - ".github/workflows/camper-planner.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione da umbrel-app.yml
        id: versione
        run: |
          v=$(grep -E '^version:' casa-camper-planner/umbrel-app.yml | sed -E 's/^version: *"?([^"]+)"?.*/\1/')
          echo "Versione: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: casa-camper-planner/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/camper-planner:${{ steps.versione.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/camper-planner:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Camper Planner
            org.opencontainers.image.version=${{ steps.versione.outputs.v }}
