# Costruisce e pubblica l'immagine Docker di Rapportini su GitHub Container Registry
# a ogni modifica del codice o della versione. Umbrel scarica l'immagine indicata in docker-compose.yml.
name: Immagine Docker Rapportini

on:
  push:
    branches: [main]
    paths:
      - "casa-rapportini/app/**"
      - "casa-rapportini/umbrel-app.yml"
      - ".github/workflows/rapportini.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione da umbrel-app.yml
        id: versione
        run: |
          v=$(grep -E '^version:' casa-rapportini/umbrel-app.yml | sed -E 's/^version: *"?([^"]+)"?.*/\1/')
          echo "Versione: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: casa-rapportini/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rapportini:${{ steps.versione.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/rapportini:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Rapportini
            org.opencontainers.image.version=${{ steps.versione.outputs.v }}
