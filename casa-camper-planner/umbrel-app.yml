releaseNotes: >-
  Condividi un viaggio con chi viaggia con te: dalla scheda Esporta crei un link in sola
  lettura con tappe, date, percorso e collegamenti per navigare, senza account e senza
  spese, diario o check-list. Puoi nascondere le note, cambiare il link o revocarlo.
  Stima dei pedaggi: l'app riconosce i tratti a pagamento del percorso e stima il costo
  sulle autostrade italiane secondo la classe del camper (scheda Mezzo), per giornata,
  nel diario dei costi e nella stampa. I viaggi già salvati ricalcolano il percorso da soli
  la prima volta che li apri.
