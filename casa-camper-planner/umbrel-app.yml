releaseNotes: >-
  Giornate di viaggio: indica i km o le ore di guida al giorno e l'app divide il percorso
  in giorni, segnala dove manca una notte e propone le aree camper e i campeggi vicini
  (prima i tuoi ACSI e quelli della raccolta); "+ Notte qui" la aggiunge e ripianifica.
  Nuova scheda Carburante con i prezzi ufficiali del Ministero (MIMIT) lungo il percorso
  o vicino a una tappa, con il più conveniente ogni 50 km e la mediana da usare nella
  stima dei costi. Collegamenti "Naviga" per aprire aree, tappe e distributori in Google
  Maps, Waze, Apple Mappe o OsmAnd.
