description: >-
  Pianifica i viaggi in camper dal tuo Umbrel.


  Aggiungi le tappe sulla mappa e l'app calcola percorso, distanze e tempi di guida.
  Per ogni tappa indichi le notti e le date si calcolano da sole.


  Cerca aree camper, campeggi, carico/scarico, acqua e GPL lungo il percorso o vicino
  a una tappa, su più fonti: OpenStreetMap, Overture Maps (dati aperti, con chiave
  gratuita) e la tua raccolta personale, dove importi file GPX, KML o CSV e salvi i
  posti preferiti. Le aree presenti in più fonti vengono unite in un solo risultato.


  Dalla raccolta importi con un clic i dati aperti di regioni ed enti turistici
  (aree camper e campeggi), oppure qualsiasi file GeoJSON, CSV, KML o GPX da un
  indirizzo web: li scarica direttamente l'Umbrel e li tiene aggiornati.


  Tieni il diario di viaggio, registra le spese per categoria, stima il carburante e
  controlla il budget. Esporta in GPX per il navigatore, stampa l'itinerario o fai un
  backup JSON.


  Con una chiave gratuita di OpenRouteService il percorso tiene conto di altezza,
  larghezza, lunghezza e massa del camper.


  I viaggi sono salvati sul tuo Umbrel. Mappe, percorsi e ricerca dei luoghi usano i
  servizi pubblici di OpenStreetMap, quindi serve la connessione a internet.
