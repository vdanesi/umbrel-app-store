releaseNotes: >-
  Importazione dei file di CamperOnLine.it: riconosce aree attrezzate, punti sosta e
  camper service, i servizi di ogni area (acqua, scarico, corrente, WC, docce, a
  pagamento) e l'indirizzo. Scarta i punti con coordinate sbagliate presenti nei file
  e ripara i nomi con caratteri rovinati. I file importati ora vengono letti con la
  codifica giusta anche quando sono in ISO-8859-1 o dichiarano una codifica sbagliata.
  Una fonte appena diventata disponibile, come la raccolta dopo il primo import, è
  subito attiva nelle ricerche.
