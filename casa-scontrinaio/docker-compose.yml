version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: casa-scontrinaio_web_1
      APP_PORT: 8080
      # Scontrinaio has its own accounts and login, so Umbrel does not ask for its password as well
      PROXY_AUTH_ADD: "false"

  web:
    # Built by .github/workflows/immagine.yml. Change the tag together with "version" in umbrel-app.yml:
    # Umbrel updates only this file and the manifest, then pulls the new image.
    image: ghcr.io/vdanesi/scontrinaio:1.3.1
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
