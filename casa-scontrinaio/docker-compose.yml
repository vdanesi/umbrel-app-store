version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: casa-scontrinaio_web_1
      APP_PORT: 8080

  web:
    # Stock Node.js image (amd64 + arm64): the app code ships in this folder, nothing to build.
    image: node:20-alpine
    user: "1000:1000"
    init: true
    restart: on-failure
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
