gallery: []
releaseNotes: >-
  Scontrinaio ora è distribuito come immagine Docker, così gli aggiornamenti arrivano
  davvero sull'Umbrel. Include pagina di accesso e registrazione, account separati,
  opzione "Resta connesso" e supporto per Cloudflare Tunnel.
  Le spese inserite con la versione 1.0.0 passano al primo account creato.
