support: https://github.com/vdanesi/umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Nuova pagina di accesso e registrazione, mostrata prima dell'app: senza account
  l'app non viene nemmeno caricata. Le registrazioni sono aperte di default e
  l'amministratore può chiuderle dal menu. Ogni account vede solo le proprie spese.
