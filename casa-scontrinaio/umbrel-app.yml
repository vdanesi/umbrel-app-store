support: https://github.com/TUO-UTENTE-GITHUB/umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Account con registrazione e login: ogni persona vede solo le proprie spese.
  Il primo account creato è l'amministratore e decide quando aprire le registrazioni.
  Le spese della versione precedente vengono assegnate al primo account.
