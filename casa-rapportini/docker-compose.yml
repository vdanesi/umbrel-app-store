version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: casa-rapportini_web_1
      APP_PORT: 3444
      # Rapportini non ha un login suo: resta attiva la password di Umbrel

  web:
    # Built by .github/workflows/rapportini.yml. Change the tag together with "version" in umbrel-app.yml.
    image: ghcr.io/vdanesi/rapportini:1.1.0
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      PORT: 3444
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
