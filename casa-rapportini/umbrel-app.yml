gallery: []
releaseNotes: >-
  Mod. 0693, riquadro VIAGGIO compilato in automatico: con "Ho usato l'auto propria"
  l'app crea una riga per ogni giornata con itinerario andata e ritorno e calcola i km
  stradali del percorso (servizi OpenStreetMap, serve internet sull'Umbrel), poi importo
  e totale. I PDF escono con il testo già stampato, uguale in ogni visualizzatore.
