releaseNotes: >-
  Nuova scheda "Migrazione PL": genera la configurazione Cisco ed Extreme e mostra la
  checklist MikroTik partendo da porta, loopback, IP PTP e tag della tratta, con copia,
  download TXT e storico personale. La chiave OSPF la inserisce l'amministratore e resta
  solo sull'Umbrel; l'amministratore può anche modificare i modelli.
